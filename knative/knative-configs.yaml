apiVersion: operator.knative.dev/v1beta1
kind: KnativeServing
metadata:
  name: knative-serving
  namespace: knative-serving
spec:
  ingress:
    kourier:
      enabled: true
      service-type: ClusterIP
    istio:
      enabled: false
  config:
    network:
      # use double quotes because of dots in value
      ingress-class: "kourier.ingress.networking.knative.dev"
    domain:
      # use double quotes because of dot for indicating a single ConfigMap key
      "example.com": ""
