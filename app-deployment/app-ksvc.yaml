apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: web-app-knative-svc
  namespace: app
spec:
  template:
    spec:
      containers:
        - image: dilankarathnasiri/simple-web-server
          name: simple-web-server
          env:
            - name: SERVER_PORT
              value: "5000"
          ports:
            - containerPort: 5000
          securityContext:
            runAsUser: 7
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL

---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: web-app-knative-http-route
  namespace: app
spec:
  parentRefs:
    - name: envoy-gateway
  rules:
    - matches:
        - path:
            type: Exact
            value: "/web-app-knative-svc"
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: "web-app-knative-svc.app.example.com"
            path:
              type: ReplaceFullPath
              replaceFullPath: "/"
      backendRefs:
        - name: kourier
          port: 80
