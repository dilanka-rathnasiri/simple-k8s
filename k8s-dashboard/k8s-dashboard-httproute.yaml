apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: k8s-dashboard
  namespace: k8s-dashboard
spec:
  parentRefs:
    - name: envoy-gw
      namespace: envoy-gw
  hostnames:
    - "k8s-dashboard.local"  # Replace with your actual domain or keep this for local testing
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kubernetes-dashboard
          port: 443  # This matches the service.port in values.yaml
          kind: Service
          namespace: k8s-dashboard
