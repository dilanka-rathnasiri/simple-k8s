# Enable or disable the dashboard UI
dashboard:
  enabled: true
  containerPort: 8443
  enableInsecureLogin: false
  enableSkip: false
  enableMetricsScraper: true

# Configure the service
service:
  type: NodePort
  nodePort: 30001
  externalPort: 443
  targetPort: 8443
  externalIPs: []
  loadBalancerIP: ""
  loadBalancerSourceRanges: []
  annotations: {}

# Configure the ingress
ingress:
  enabled: false
  annotations: {}
  hosts: []
  tls: []

# Configure the service account
serviceAccount:
  create: true
  name: ""
  annotations: {}

# Configure the cluster role binding
rbac:
  create: true
  clusterRoleMetrics: true
  clusterReadOnlyRole: true

# Configure the metrics scraper
metricsScraper:
  enabled: true

# Configure the metrics server
metricsServer:
  enabled: true
  hostNetwork: false
  replicas: 1
  updateStrategy: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}
  securityContext: {}
  containerSecurityContext: {}
